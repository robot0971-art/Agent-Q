name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\csharp\AgentQ.sln

      - name: Build
        run: dotnet build .\csharp\AgentQ.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\csharp\AgentQ.sln -c Release --no-build --logger trx --results-directory .\artifacts\test-results

      - name: Pack CLI tool
        run: dotnet pack .\csharp\AgentQ.Cli\AgentQ.Cli.csproj -c Release --no-build

      - name: Upload CLI package
        uses: actions/upload-artifact@v4
        with:
          name: agentq-cli-package
          path: artifacts/packages/*.nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx

  docker-mockservice:
    name: Docker mock service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mock service image
        run: docker build -f Dockerfile.mockservice -t agentq-mockservice:ci .
