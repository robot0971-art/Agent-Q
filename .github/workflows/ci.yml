name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\csharp\AgentQ.sln

      - name: Format check
        run: dotnet format .\csharp\AgentQ.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build .\csharp\AgentQ.sln -c Release --no-restore

      - name: Test non-integration suite with hang and crash diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = '.\artifacts\test-results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $arguments = @('test', '.\csharp\AgentQ.sln', '-c', 'Release', '--no-build', '--filter', 'Category!=Integration', '--logger', 'trx;LogFileName=non-integration.trx', '--results-directory', $results, '--collect:XPlat Code Coverage', '--blame-hang', '--blame-hang-timeout', '60s', '--blame-crash', '--diag', "$results\non-integration-vstest-diag.log")
          $process = Start-Process dotnet -ArgumentList $arguments -NoNewWindow -PassThru
          $known = [System.Collections.Generic.HashSet[int]]::new()
          [void]$known.Add($process.Id)
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(7)
          do {
            $snapshot = @(Get-CimInstance Win32_Process | Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine)
            $changed = $true
            while ($changed) {
              $changed = $false
              foreach ($candidate in $snapshot) {
                if ($known.Contains([int]$candidate.ParentProcessId) -and $known.Add([int]$candidate.ProcessId)) {
                  $changed = $true
                }
              }
            }
            Start-Sleep -Seconds 1
          } while (-not $process.HasExited -and [DateTimeOffset]::UtcNow -lt $deadline)
          if (-not $process.HasExited) {
            $snapshot | Where-Object { $known.Contains([int]$_.ProcessId) } |
              ConvertTo-Json -Depth 3 | Set-Content "$results\timeout-processes.json"
            & taskkill.exe /PID $process.Id /T /F | Out-Host
            throw "Non-integration tests timed out after 420 seconds; only the CI test root process tree was terminated."
          }
          $stillOwned = @(Get-CimInstance Win32_Process | Where-Object { $known.Contains([int]$_.ProcessId) })
          if ($stillOwned.Count -gt 0) {
            $stillOwned | Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine |
              ConvertTo-Json -Depth 3 | Set-Content "$results\residual-owned-processes.json"
            throw "dotnet test exited but left process(es) owned by this CI test run. See residual-owned-processes.json."
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Test integration suite with hang and crash diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = '.\artifacts\test-results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $arguments = @('test', '.\csharp\AgentQ.sln', '-c', 'Release', '--no-build', '--filter', 'Category=Integration', '--logger', 'trx;LogFileName=integration.trx', '--results-directory', $results, '--collect:XPlat Code Coverage', '--blame-hang', '--blame-hang-timeout', '60s', '--blame-crash', '--diag', "$results\integration-vstest-diag.log")
          $process = Start-Process dotnet -ArgumentList $arguments -NoNewWindow -PassThru
          if (-not $process.WaitForExit(180000)) {
            Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $process.Id -or $_.ParentProcessId -eq $process.Id } |
              Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine |
              ConvertTo-Json -Depth 3 | Set-Content "$results\integration-timeout-processes.json"
            & taskkill.exe /PID $process.Id /T /F | Out-Host
            throw "Integration tests timed out after 180 seconds; only the CI test root process tree was terminated."
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Publish desktop app
        run: >
          dotnet publish .\csharp\AgentQ.Desktop\AgentQ.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\desktop\win-x64

      - name: Archive desktop app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\desktop-package | Out-Null
          Compress-Archive `
            -Path .\artifacts\desktop\win-x64\* `
            -DestinationPath .\artifacts\desktop-package\AgentQ.Desktop-win-x64.zip `
            -Force

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: agentq-desktop-win-x64
          path: artifacts/desktop-package/AgentQ.Desktop-win-x64.zip

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: artifacts/test-results/**/coverage.cobertura.xml

  docker-mockservice:
    name: Docker mock service smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build mock service image
        run: docker build -f Dockerfile.mockservice -t agentq-mockservice:ci .

      - name: Start mock service container
        run: docker run -d --name agentq-mockservice -p 18080:18080 agentq-mockservice:ci

      - name: Wait for mock service
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -sS -o /dev/null http://localhost:18080/v1/messages; then
              exit 0
            fi
            sleep 1
          done
          docker logs agentq-mockservice
          exit 1

      - name: Run internal CLI Runtime-contract smoke against mock service
        shell: pwsh
        env:
          AGENTQ_PROVIDER: anthropic
          AGENTQ_MODEL: demo-model
          AGENTQ_API_KEY: demo-key
          AGENTQ_BASE_URL: http://localhost:18080
          AGENTQ_CONFIG_HOME: ${{ runner.temp }}/agentq-config
        run: |
          dotnet run --project ./csharp/AgentQ.Cli -- `
            --prompt "PARITY_SCENARIO:plugin_tool_roundtrip" `
            --allow-tool plugin_echo `
            --json | Tee-Object -FilePath cli-smoke.json
          $result = Get-Content cli-smoke.json -Raw | ConvertFrom-Json
          if (-not $result.success) {
            throw "Internal CLI Runtime-contract smoke failed: $($result | ConvertTo-Json -Depth 10)"
          }
          if ($result.finalText -ne "plugin tool completed: hello from plugin parity") {
            throw "Unexpected finalText: $($result.finalText)"
          }

      - name: Show mock service logs
        if: always()
        run: docker logs agentq-mockservice || true

      - name: Stop mock service container
        if: always()
        run: docker rm -f agentq-mockservice || true
